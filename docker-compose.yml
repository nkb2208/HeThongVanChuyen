services:
  backend:
    build:
      context: ./demo
      dockerfile: Dockerfile
    container_name: giaonhanh-backend
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/db_giaonhanh_logistics?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    restart: unless-stopped

  frontend:
    build:
      context: ./hethongvanchuyen-frontend
      dockerfile: Dockerfile
    container_name: giaonhanh-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
